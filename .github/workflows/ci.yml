name: CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: github-devops-lab

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JOB_NAME: Build Job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Current Directory
        run: pwd

      - name: Display Repository Files
        run: ls -la

      - name: Display README
        run: cat README.md

      - name: Print Workflow Environment Variable
        run: echo "Application = $APP_NAME"

      - name: Print Job Environment Variable
        run: echo "Job = $JOB_NAME"

      - name: Print Repository Variable
        run: echo "Environment = ${{ vars.ENVIRONMENT }}"

      - name: Print Repository Secret
        run: echo "Hello ${{ secrets.MY_NAME }}"

      - name: Print Success Message
        run: echo "CI Pipeline Completed Successfully!"
